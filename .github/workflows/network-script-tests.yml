name: Network script tests

on:
  push:
    branches:
      - 'perf/**'
    paths:
      - 'Surfing_service.sh'
      - 'box_bll/scripts/**'
      - '.github/tests/**'
      - '.github/tools/**'
      - 'customize.sh'
      - 'build.sh'
      - '.github/workflows/network-script-tests.yml'
  pull_request:
    paths:
      - 'Surfing_service.sh'
      - 'box_bll/scripts/**'
      - '.github/tests/**'
      - '.github/tools/**'
      - 'customize.sh'
      - 'build.sh'
      - '.github/workflows/network-script-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: |
          bash -n Surfing_service.sh
          bash -n box_bll/scripts/net.inotify
          bash -n box_bll/scripts/ctr.inotify
          bash -n box_bll/scripts/network.events
          bash -n box_bll/scripts/box.service
          bash -n box_bll/scripts/power-profile.sh
          sh -n customize.sh
          sh -n build.sh
      - name: Run mocked network event regressions
        run: python3 -m unittest discover -s .github/tests -v
